<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Tokens live in JavaScript memory, so the policy limits where injected
      script could send one: the API and the Auth0 tenant only. See
      DECISIONS.md, "Headers, rate limiting and logging". Emotion (MUI) injects
      <style> tags, hence 'unsafe-inline' for styles only. frame-src lets the
      Auth0 SDK try silent sign-in, which the tenant refuses.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' %VITE_API_URL% https://%VITE_AUTH0_DOMAIN%; frame-src https://%VITE_AUTH0_DOMAIN%; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
